[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo11-inference"
dynamic = ["version"]
description = "Industrial vision inspection system integrating YOLO object detection and Anomalib anomaly detection"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = "LicenseRef-Proprietary"
authors = [
    {name = "DioWang", email = "a0983743448@gmail.com"}
]
keywords = ["yolo", "anomaly-detection", "computer-vision", "quality-inspection", "industrial-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    # Core inference
    "torch==2.14.1",
    "torchvision==0.29.1",
    "lightning==2.6.6",
    "anomalib==2.7.0",
    "ultralytics==8.4.176",
    "onnxruntime==1.24.3",
    
    # Data processing
    "numpy==2.2.6",
    "opencv-python==5.0.0.93",
    "pillow==12.3.0",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "matplotlib==3.10.9",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    
    # Anomalib support
    "kornia==0.8.2",
    "timm==1.0.30",
    "einops==0.8.2",
    "FrEIA==0.2",
    "python-dotenv==1.2.4",
    "open-clip-torch==3.3.0",
    
    # Utilities
    "jsonargparse==4.52.0",
    "pydantic>=1.10,<3.0",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "tqdm==4.70.1",
    "typing_extensions==4.16.0",
    "imgaug>=0.4.0",

    # Hardware I/O
    "pyserial==3.5",
]

[project.optional-dependencies]
gui = [
    "PyQt5==5.15.11",
]

dev = [
    "pytest==9.1.1",
    "pytest-cov>=4.0.0",
    "pytest-qt>=4.2.0",
    "pytest-timeout>=2.4.0",
    "PyQt5==5.15.11",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests==2.33.0.20261006",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.scripts]
yolo11-inference = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.dynamic]
version = {attr = "core._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "app*", "camera*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
]
markers = [
    "gui: GUI smoke tests that require PyQt5 (offscreen)",
    "slow: Slow running tests",
    "integration: Integration tests",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "MvImport",
    "Runtime",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E203", # whitespace before ':'
    "E501", # line too long (handled by line-length)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"patch_gui2.py" = ["E501"]
"MvImport/*" = ["E501", "F401", "F403"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
# ``app`` is a PEP 420 namespace package (no ``app/__init__.py``) while
# ``app/acceptance`` is a regular one. Walking up from
# ``app/acceptance/window.py``, mypy stops at the missing ``app/__init__.py``
# and names the module ``acceptance.window``; the code imports it as
# ``app.acceptance.window``, so the same file arrives under two names and mypy
# aborts before building the graph. Anchoring package bases at the repo root
# makes the name mypy derives from the path match the one the imports use,
# without adding an ``__init__.py`` that would turn ``app`` into a regular
# package and change how it is discovered at runtime and by PyInstaller.
# CI already passes --explicit-package-bases for its own mypy step; this keeps
# a plain ``mypy app`` working the same way locally.
mypy_path = "."
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "ultralytics.*",
    "anomalib.*",
    "lightning.*",
    "kornia.*",
    "timm.*",
    "einops.*",
    "FrEIA.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["core", "app", "camera"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
