# Auto-trigger tuning for Cable1/A.
#
# Trigger latency is counted in FRAMES, not milliseconds:
#   latency = (appear_frames + 1 + stable_frames) x frame_interval
# The camera on this station was measured at 67.4 ms per frame (14.8 fps,
# 21.1 ms exposure + ~46 ms readout/transfer of a 6.29 MB Bayer frame at
# Gigabit line rate). Every frame removed from the gate is therefore worth
# ~67 ms, and every millisecond saved on the camera is worth ~6x that here.
#
# Defaults were 3 + 1 + 6 = 10 frames = ~674 ms. The values below make it
# 2 + 1 + 3 = 6 frames = ~404 ms.

# Calibrated by the GUI's Auto-Trigger Calibration against this station's
# empty scene. DO NOT DROP: the built-in default is 5000, and this station's
# empty background already measures ~7900 contour area, so falling back to the
# default makes an empty stage read as "product present" and the trigger fires
# continuously.
product_area_threshold: 46712

# Frames of product presence before advancing out of WAIT_EMPTY.
# 3 -> 2: presence is a contour-area test with a large calibrated margin
# (7.9k empty against a 46.7k threshold), so a third confirming frame buys
# little against a 67 ms cost.
appear_frames: 2

# Consecutive low-motion, sharp frames required to fire.
# 6 -> 3: this is the real latency driver, and the one to revert first if
# blurred captures appear. Three frames is ~200 ms of confirmed stillness at
# this frame rate. The per-frame quality bars below are unchanged, so each
# frame is judged exactly as strictly as before; only the run length is
# shorter. Any frame over motion_threshold still resets the count to zero.
stable_frames: 3

# Floor between consecutive triggers. 500 -> 250: at 6 gate frames the gate
# itself takes ~404 ms, so a 500 ms floor was becoming the binding constraint
# for back-to-back inspections rather than a safety margin.
inspection_cooldown_ms: 250

# Left at defaults deliberately: motion_threshold (3.0) and
# sharpness_threshold (100.0) decide WHETHER a frame is acceptable, not how
# fast the trigger fires. The empty scene measures motion 0.98 and sharpness
# 699, so both have large margins here — but those are empty-stage numbers.
# Tightening them without measuring a real board risks a gate that never
# fires, which is a line stoppage rather than a slow line.
