version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5
    # Coupled to anomalib 2.7.0 on torch 2.13.0 (upgraded together 2026-10).
    # Moving any of these is a station-validated upgrade, not a bot PR; their
    # alerts stay visible.
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "lightning"
      - dependency-name: "pytorch-lightning"
      - dependency-name: "anomalib"
      - dependency-name: "kornia"
      - dependency-name: "timm"
      - dependency-name: "open-clip-torch"
      - dependency-name: "ultralytics"
      - dependency-name: "numpy"
      - dependency-name: "opencv-python*"
      - dependency-name: "onnxruntime"
      - dependency-name: "jsonargparse"
