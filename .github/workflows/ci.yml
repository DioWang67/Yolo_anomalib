name: CI

on:
  push:
    branches: [main, master, develop, 0901color]
  pull_request:
    branches: [main, master, develop, 0901color]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Blocking quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Reject correctness-level lint errors
        run: |
          ruff check core app camera tools tests --select E9,F63,F7,F82,F811,B023
      - name: Lint hardened production modules
        run: |
          ruff check \
            core/services/inspection_database.py \
            core/services/inspection_excel_report.py \
            core/services/inspection_history.py \
            core/services/inspection_maintenance.py \
            core/services/inspection_sync.py \
            app/gui/inspection_history_page.py \
            app/gui/panels/control_panel.py \
            tools/check_runtime_environment.py \
            tools/inspection_sync_admin.py \
            tools/maintain_inspection_data.py \
            tools/production_preflight.py \
            tools/restore_inspection_database.py
      - name: Type-check hardened production modules
        run: |
          mypy --follow-imports=skip --ignore-missing-imports --explicit-package-bases \
            core/services/inspection_database.py \
            core/services/inspection_excel_report.py \
            core/services/inspection_history.py \
            core/services/inspection_maintenance.py \
            core/services/inspection_sync.py \
            app/gui/inspection_history_page.py \
            app/gui/panels/control_panel.py \
            tools/check_runtime_environment.py \
            tools/inspection_sync_admin.py \
            tools/production_preflight.py \
            tools/restore_inspection_database.py

  tests:
    name: Tests (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libgomp1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Verify supported runtime
        run: python tools/check_runtime_environment.py
      - name: Run non-GUI test suite
        run: pytest -m "not gui" --timeout=60
      - name: Run GUI smoke suite on Windows
        if: runner.os == 'Windows'
        run: pytest -m gui --timeout=60

  coverage:
    name: Coverage gate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libgomp1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          pytest -m "not gui" --timeout=60 \
            --cov=core --cov=app \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=60
      - name: Enforce 80 percent on hardened workflows
        run: |
          pytest \
            tests/test_inspection_database.py \
            tests/test_inspection_excel_report.py \
            tests/test_inspection_maintenance.py \
            tests/test_inspection_sync.py \
            tests/test_inspection_sync_admin.py \
            tests/test_production_preflight.py \
            tests/test_restore_inspection_database.py \
            tests/test_inspection_history.py \
            tests/test_control_panel_permissions.py \
            tests/test_pin_attempt_guard.py \
            --cov=core.services.inspection_database \
            --cov=core.services.inspection_excel_report \
            --cov=core.services.inspection_maintenance \
            --cov=core.services.inspection_history \
            --cov=core.services.inspection_sync \
            --cov=app.gui.inspection_history_page \
            --cov=app.gui.panels.control_panel \
            --cov=tools.production_preflight \
            --cov-report=term-missing \
            --cov-fail-under=80
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  package:
    name: Python package
    needs: [quality, tests, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build and verify wheel
        run: |
          python -m build
          twine check dist/*
          python -m pip install --no-deps --force-reinstall dist/*.whl
          yolo11-inference --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  windows-executable:
    name: Verified Windows executable
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [quality, tests, coverage]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Build and verify executable
        shell: cmd
        run: |
          set "YOLO11_PYTHON=%pythonLocation%\python.exe"
          call build_exe.bat
      - uses: actions/upload-artifact@v4
        with:
          name: yolo11-inference-windows
          path: dist/yolo11_inference/
          if-no-files-found: error
