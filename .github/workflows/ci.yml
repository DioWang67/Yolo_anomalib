name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Blocking quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install quality tools
        run: python -m pip install --requirement requirements-quality.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Reject correctness-level lint errors
        run: python -m ruff check core app camera tools tests --select E9,F63,F7,F82,F811,B023
      - name: Lint hardened production modules
        run: |
          python -m ruff check \
            core/services/inspection_database.py \
            core/services/inspection_excel_report.py \
            core/services/inspection_history.py \
            core/services/inspection_maintenance.py \
            core/services/inspection_release_store.py \
            core/services/inspection_sync.py \
            app/gui/inspection_history_page.py \
            app/gui/panels/control_panel.py \
            tools/check_runtime_environment.py \
            tools/inspection_sync_admin.py \
            tools/maintain_inspection_data.py \
            tools/production_preflight.py \
            tools/restore_inspection_database.py
      - name: Type-check hardened production modules
        run: |
          python -m mypy --follow-imports=skip --ignore-missing-imports --explicit-package-bases \
            core/services/inspection_database.py \
            core/services/inspection_excel_report.py \
            core/services/inspection_history.py \
            core/services/inspection_maintenance.py \
            core/services/inspection_release_store.py \
            core/services/inspection_sync.py \
            app/gui/inspection_history_page.py \
            app/gui/panels/control_panel.py \
            tools/check_runtime_environment.py \
            tools/inspection_sync_admin.py \
            tools/production_preflight.py \
            tools/restore_inspection_database.py

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: windows-latest
            python: "3.11"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libgomp1
      - name: Install locked dependencies
        if: matrix.python == '3.11'
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
      - name: Resolve Python 3.10 compatible dependencies
        if: matrix.python == '3.10'
        run: python -m pip install --editable ".[gui,dev]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify supported runtime
        run: python tools/check_runtime_environment.py
      - name: Run non-GUI test suite
        run: |
          python -c "from pathlib import Path; Path('reports').mkdir(exist_ok=True)"
          python -m pytest -m "not gui" --timeout=60 --junitxml=reports/non-gui.xml
      - name: Run GUI smoke suite on Windows
        if: runner.os == 'Windows'
        run: python -m pytest -m gui --timeout=60 --junitxml=reports/gui.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ runner.os }}-py${{ matrix.python }}
          path: reports/*.xml
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Coverage gates
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libgomp1
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m pip check
      - name: Measure non-GUI project coverage
        run: |
          python -c "from pathlib import Path; Path('reports').mkdir(exist_ok=True)"
          python -m pytest -m "not gui" --timeout=60 \
            --cov=core --cov=app --cov=camera \
            --cov-report= \
            --cov-fail-under=0 \
            --junitxml=reports/coverage-non-gui-junit.xml
      - name: Append GUI project coverage
        run: |
          python -m pytest -m gui --timeout=60 \
            --cov=core --cov=app --cov=camera \
            --cov-append \
            --cov-report= \
            --cov-fail-under=0 \
            --junitxml=reports/coverage-gui-junit.xml
      - name: Enforce 80 percent project-wide coverage
        run: |
          python -m coverage xml -o reports/coverage.xml
          python -m coverage report --show-missing --fail-under=80
      - name: Enforce 80 percent on critical workflows
        run: |
          python -m pytest \
            tests/test_inspection_database.py \
            tests/test_inspection_excel_report.py \
            tests/test_inspection_maintenance.py \
            tests/test_inspection_release.py \
            tests/test_inspection_sync.py \
            tests/test_inspection_sync_admin.py \
            tests/test_production_preflight.py \
            tests/test_restore_inspection_database.py \
            tests/test_inspection_history.py \
            tests/test_control_panel_permissions.py \
            tests/test_pin_attempt_guard.py \
            --cov=core.services.inspection_database \
            --cov=core.services.inspection_excel_report \
            --cov=core.services.inspection_maintenance \
            --cov=core.services.inspection_release_store \
            --cov=core.services.inspection_history \
            --cov=core.services.inspection_sync \
            --cov=app.gui.inspection_history_page \
            --cov=app.gui.panels.control_panel \
            --cov=tools.production_preflight \
            --cov-report=term-missing \
            --cov-fail-under=80
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: reports/*.xml
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Python package
    needs: [tests, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install packaging tools
        # Keep this twine pin equal to requirements-dev.txt so the repo has one
        # version. This job installs in isolation without lightning, so 7.0.0
        # would work here, but two pins for the same tool invite drift.
        run: python -m pip install build==1.3.0 twine==6.2.0 PyYAML==6.0.2
      - name: Build and verify wheel
        run: |
          python -m build
          python -m twine check dist/*
          python -m pip install --no-deps --force-reinstall dist/*.whl
          yolo11-inference --help
      - name: Upload Python package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
          retention-days: 14

  windows-executable:
    name: Verified Windows executable
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [tests, coverage]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install build dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m pip check
      - name: Build and verify executable
        shell: cmd
        run: |
          set "YOLO11_PYTHON=%pythonLocation%\python.exe"
          call build_exe.bat
      - name: Upload Windows executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yolo11-inference-windows
          path: dist/yolo11_inference/
          if-no-files-found: error
          retention-days: 14
